name: Feature request
description: 提议新能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景，而不是只给实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 区域
      options:
        - 模型 / 服务商
        - 聊天体验
        - Agent 执行
        - 安全 / 审批
        - MCP / Skills
        - 后台任务
        - 国际化
        - 文档
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 安全与权限影响
      description: 是否需要新权限？是否可能绕过审批或访问更多数据？
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 该需求不要求 Root、绕过系统权限或未认证远程控制
          required: true
