navigation = "2.9.8"
room = "2.8.3"
work = "2.10.5"
datastore = "1.1.7"
okhttp = "4.12.0"
serializationJson = "1.8.1"
coroutines = "1.10.2"
shizuku = "13.1.5"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
